<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP Robot Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            padding-top: 80px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .card {
            background: rgba(26, 26, 26, 0.95);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .card h2 {
            color: #00ff88;
            margin-bottom: 15px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2 svg {
            width: 24px;
            height: 24px;
            fill: #00ff88;
        }

        .emergency-stop {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            background: linear-gradient(135deg, #cc0000 0%, #990000 100%);
            color: white;
            border: 3px solid #ff0000;
            border-radius: 12px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .emergency-stop:hover {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(255, 0, 0, 0.6);
        }

        .emergency-stop:active {
            transform: scale(0.95);
        }

        .emergency-stop svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .sensor-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            margin-top: 10px;
        }

        .sensor-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #44ff44;
            text-shadow: 0 0 10px rgba(68, 255, 68, 0.5);
        }

        .sensor-status {
            font-size: 1.2em;
            padding: 8px 16px;
            border-radius: 6px;
            background: rgba(68, 255, 68, 0.2);
            color: #44ff44;
        }

        .sensor-status.locked {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
        }

        .slider-group {
            margin: 15px 0;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #aaa;
            font-weight: 500;
        }

        .slider-value {
            color: #00ff88;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00ff88;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00ff88;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .action-btn {
            background: linear-gradient(135deg, #1a1a2e 0%, #2a2a3e 100%);
            border: 2px solid #00ff88;
            color: #00ff88;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .action-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .connection-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 9998;
        }

        .connection-status.connected {
            background: rgba(68, 255, 68, 0.2);
            color: #44ff44;
            border: 1px solid #44ff44;
        }

        .connection-status.disconnected {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 768px) {
            .emergency-stop {
                padding: 12px 20px;
                font-size: 14px;
            }

            .action-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <button class="emergency-stop" onclick="emergencyStop()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/>
        </svg>
        EMERGENCY STOP
    </button>

    <div class="container">
        <h1>ESP Robot Control</h1>

        <div class="card">
            <h2>
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7.76 16.24C6.67 15.16 6 13.66 6 12s.67-3.16 1.76-4.24l1.42 1.42C8.45 9.9 8 10.9 8 12c0 1.1.45 2.1 1.17 2.83l1.42 1.42C9.9 15.55 8.9 16 8 16c-.9 0-1.9-.45-2.66-1.17zM12 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm8.24 6.24l-1.42-1.42C19.55 14.1 20 13.1 20 12c0-1.1-.45-2.1-1.17-2.83l-1.42-1.42C18.1 8.45 19.1 8 20 8c.9 0 1.9.45 2.66 1.17C23.33 9.84 24 11.34 24 13s-.67 3.16-1.76 4.24zM12 4c1.1 0 2.1.45 2.83 1.17l1.42-1.42C15.16 2.67 13.66 2 12 2s-3.16.67-4.24 1.76l1.42 1.42C9.9 4.45 10.9 4 12 4zm0 16c-1.1 0-2.1-.45-2.83-1.17l-1.42 1.42C8.84 21.33 10.34 22 12 22s3.16-.67 4.24-1.76l-1.42-1.42C14.1 19.55 13.1 20 12 20z"/>
                </svg>
                Ultrasonic Sensor
            </h2>
            <div class="sensor-display">
                <div>
                    <div style="color: #888; margin-bottom: 5px;">Distance</div>
                    <div class="sensor-value" id="sensor-distance">-- cm</div>
                </div>
                <div>
                    <div style="color: #888; margin-bottom: 5px;">Status</div>
                    <div class="sensor-status" id="sensor-status">Normal</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                </svg>
                Servo Control
            </h2>
            
            <div class="slider-group">
                <div class="slider-label">
                    <span>Low Left</span>
                    <span class="slider-value" id="ll-value">90°</span>
                </div>
                <input type="range" min="0" max="180" value="90" data-servo="low_left" oninput="updateSlider(this)">
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span>High Right</span>
                    <span class="slider-value" id="hr-value">90°</span>
                </div>
                <input type="range" min="0" max="180" value="90" data-servo="high_right" oninput="updateSlider(this)">
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span>High Left</span>
                    <span class="slider-value" id="hl-value">90°</span>
                </div>
                <input type="range" min="0" max="180" value="90" data-servo="high_left" oninput="updateSlider(this)">
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span>Low Right</span>
                    <span class="slider-value" id="lr-value">90°</span>
                </div>
                <input type="range" min="0" max="180" value="90" data-servo="low_right" oninput="updateSlider(this)">
            </div>
        </div>

        <div class="card">
            <h2>
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/>
                </svg>
                Actions
            </h2>
            <div class="action-grid">
                <button class="action-btn" onclick="sendAction('stand')">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
                    Stand
                </button>
                <button class="action-btn" onclick="sendAction('sit')">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
                    Sit
                </button>
                <button class="action-btn" onclick="sendAction('forward')">
                    <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                    Forward
                </button>
                <button class="action-btn" onclick="sendAction('backward')">
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                    Backward
                </button>
                <button class="action-btn" onclick="sendAction('left_wave')">
                    <svg viewBox="0 0 24 24"><path d="M14 7l-5 5 5 5V7z"/></svg>
                    Left Wave
                </button>
                <button class="action-btn" onclick="sendAction('right_wave')">
                    <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v10z"/></svg>
                    Right Wave
                </button>
                <button class="action-btn" onclick="sendAction('crawl')">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
                    Crawl
                </button>
                <button class="action-btn" onclick="sendAction('stop')">
                    <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                    Stop
                </button>
            </div>
        </div>
    </div>

    <div class="connection-status disconnected" id="connection-status">
        <div class="status-dot"></div>
        <span>Disconnected</span>
    </div>

    <script>
        let ws = null;
        let sensorUpdateInterval = null;
        let servoUpdateTimeout = null;

        function connectWebSocket() {
            const wsUrl = 'ws://' + window.location.hostname + '/ws';
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function() {
                updateConnectionStatus(true);
                startSensorUpdates();
            };
            
            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.sensor_distance !== undefined) {
                        updateSensorDisplay(data.sensor_distance, data.safety_lock);
                    }
                } catch (e) {}
            };
            
            ws.onclose = function() {
                updateConnectionStatus(false);
                setTimeout(connectWebSocket, 2000);
            };

            ws.onerror = function() {
                updateConnectionStatus(false);
            };
        }

        function updateConnectionStatus(connected) {
            const statusElement = document.getElementById('connection-status');
            if (connected) {
                statusElement.className = 'connection-status connected';
                statusElement.innerHTML = '<div class="status-dot"></div><span>Connected</span>';
            } else {
                statusElement.className = 'connection-status disconnected';
                statusElement.innerHTML = '<div class="status-dot"></div><span>Disconnected</span>';
            }
        }

        function updateSlider(slider) {
            const servoId = slider.dataset.servo;
            const angle = parseInt(slider.value, 10);
            const valueDisplay = document.getElementById(servoId.replace('_', '-') + '-value');
            
            if (valueDisplay) {
                valueDisplay.textContent = angle + '°';
            }

            sendServoUpdate(servoId, angle);
        }

        function sendServoUpdate(id, angle) {
            clearTimeout(servoUpdateTimeout);
            servoUpdateTimeout = setTimeout(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ id: id, angle: angle }));
                } else {
                    fetch('/servo', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: id, angle: angle })
                    });
                }
            }, 30);
        }

        function sendAction(action) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: action }));
            } else {
                fetch('/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: action })
                });
            }
        }

        function updateSensorDisplay(distance, safetyLock) {
            const sensorElement = document.getElementById('sensor-distance');
            const statusElement = document.getElementById('sensor-status');
            
            if (sensorElement) {
                if (distance !== undefined && distance > 0.0 && distance <= 400.0) {
                    sensorElement.textContent = distance.toFixed(1) + ' cm';
                    if (distance < 20) {
                        sensorElement.style.color = '#ff4444';
                    } else if (distance < 50) {
                        sensorElement.style.color = '#ffaa00';
                    } else {
                        sensorElement.style.color = '#44ff44';
                    }
                } else {
                    sensorElement.textContent = '-- cm';
                    sensorElement.style.color = '#888';
                }
            }
            
            if (statusElement) {
                if (safetyLock) {
                    statusElement.textContent = 'SAFETY LOCKED';
                    statusElement.className = 'sensor-status locked';
                } else {
                    statusElement.textContent = 'Normal';
                    statusElement.className = 'sensor-status';
                }
            }
        }

        function startSensorUpdates() {
            if (sensorUpdateInterval) clearInterval(sensorUpdateInterval);
            
            sensorUpdateInterval = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ action: 'get_sensor' }));
                } else {
                    fetch('/sensor')
                        .then(r => r.json())
                        .then(d => {
                            if (d.distance !== undefined) {
                                updateSensorDisplay(d.distance, d.enabled && d.distance > 0 && d.distance < d.threshold);
                            }
                        })
                        .catch(() => {});
                }
            }, 300);
        }

        function emergencyStop() {
            sendAction('stop');
            
            const btn = document.querySelector('.emergency-stop');
            btn.style.background = 'linear-gradient(135deg, #ff0000 0%, #cc0000 100%)';
            setTimeout(() => {
                btn.style.background = 'linear-gradient(135deg, #cc0000 0%, #990000 100%)';
            }, 200);
        }

        window.onload = function() {
            connectWebSocket();
            startSensorUpdates();
            
            document.querySelectorAll('input[type="range"][data-servo]').forEach(slider => {
                slider.addEventListener('input', function() {
                    updateSlider(this);
                });
            });
        };
    </script>
</body>
</html>
